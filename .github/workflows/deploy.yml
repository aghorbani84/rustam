name: Deploy RUSTAM to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build
        run: dx build --release

      - name: Inspect build output
        run: |
          echo "===== dist tree ====="
          find dist -maxdepth 3 | sort || true
          echo "====================="

      - name: Normalize output + SPA fallback
        run: |
          set -euo pipefail
          IDX=$(find dist -name index.html -print -quit)
          if [ -z "$IDX" ]; then
            echo "::error::index.html not found under dist/"
            exit 1
          fi
          IDX_DIR=$(dirname "$IDX")
          echo "index.html located at: $IDX"
          if [ "$IDX_DIR" != "dist" ]; then
            echo "Flattening $IDX_DIR into dist/ ..."
            cp -r "$IDX_DIR"/. dist/
          fi
          cp dist/index.html dist/404.html
          echo "===== final dist root ====="
          ls -la dist
          echo "==========================="

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
