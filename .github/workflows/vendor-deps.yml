name: Vendor dependencies (temporary)

on:
  push:
    branches: [arena/79ce9ac4-rustam]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Vendor dependencies
        run: |
          set -euo pipefail
          cargo vendor --locked vendor
          du -sh vendor
          tar -czf vendor.tar.gz vendor
          ls -lh vendor.tar.gz

      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: Publish vendor snapshot to temporary branch
        run: |
          set +e
          {
            set -x
            rm -rf /tmp/vendor-snapshot
            mkdir -p /tmp/vendor-snapshot
            cp -a vendor /tmp/vendor-snapshot/vendor
            cd /tmp/vendor-snapshot
            git init -q
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Temporary vendor snapshot for offline build"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" vendor-snapshot:refs/heads/vendor-snapshot --force
          } > /tmp/publish.log 2>&1
          STATUS=$?
          echo "EXIT=$STATUS" >> /tmp/publish.log
          sed -E 's#https://[^@]*@#https://***@#g' /tmp/publish.log > /tmp/publish-redacted.log
          python3 -c 'import json; print(json.dumps({"title":"vendor-publish-debug","body":open("/tmp/publish-redacted.log").read()}))' > /tmp/issue.json
          curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" -d @/tmp/issue.json > /tmp/issue-response.json || true
          cat /tmp/issue-response.json >> /tmp/publish-redacted.log || true
          exit $STATUS
