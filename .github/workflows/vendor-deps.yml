name: Vendor dependencies (temporary)

on:
  push:
    branches: [arena/79ce9ac4-rustam]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Vendor dependencies
        run: |
          set -euo pipefail
          cargo vendor --locked vendor
          du -sh vendor
          tar -czf vendor.tar.gz vendor
          ls -lh vendor.tar.gz

      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: Debug copy vendor
        run: |
          set -x
          rm -rf /tmp/vendor-snapshot
          mkdir -p /tmp/vendor-snapshot
          cp -a vendor /tmp/vendor-snapshot/vendor
          du -sh /tmp/vendor-snapshot/vendor

      - name: Debug git init
        run: |
          set -x
          cd /tmp/vendor-snapshot
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Debug git add
        run: |
          set -x
          cd /tmp/vendor-snapshot
          git add -A

      - name: Debug git commit
        run: |
          set -x
          cd /tmp/vendor-snapshot
          git commit -q -m "Temporary vendor snapshot for offline build"

      - name: Debug git push
        run: |
          set -x
          cd /tmp/vendor-snapshot
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" vendor-snapshot:refs/heads/vendor-snapshot --force 2>&1 | sed -E 's#https://[^@]*@#https://***@#g'

      - name: Debug report
        run: |
          set -x
          echo "token header:"
          curl -sI -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/user | grep -i 'x-oauth-scopes\|x-accepted' || true
          echo "permissions:"
          curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/${{ github.repository }} | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("permissions"))' || true
