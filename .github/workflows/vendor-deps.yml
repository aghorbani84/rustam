name: Vendor dependencies (temporary)

on:
  push:
    branches: [arena/79ce9ac4-rustam]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  checks: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Vendor dependencies
        run: |
          set -euo pipefail
          cargo vendor --locked vendor
          du -sh vendor
          tar -czf vendor.tar.gz vendor
          ls -lh vendor.tar.gz

      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: Debug copy vendor
        run: |
          set -x
          rm -rf /tmp/vendor-snapshot
          mkdir -p /tmp/vendor-snapshot
          cp -a vendor /tmp/vendor-snapshot/vendor
          du -sh /tmp/vendor-snapshot/vendor

      - name: Debug git init
        run: |
          set -x
          cd /tmp/vendor-snapshot
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Debug git add
        run: |
          set -x
          cd /tmp/vendor-snapshot
          git add -A

      - name: Debug git commit
        run: |
          set -x
          cd /tmp/vendor-snapshot
          git commit -q -m "Temporary vendor snapshot for offline build"

      - name: Debug git push
        continue-on-error: true
        run: |
          set -x
          cd /tmp/vendor-snapshot
          set +e
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" vendor-snapshot:refs/heads/vendor-snapshot --force > /tmp/push.log 2>&1
          STATUS=$?
          echo "PUSH_EXIT=$STATUS" >> /tmp/push.log
          echo "=== token permissions ===" >> /tmp/push.log
          curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/${{ github.repository }} | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("permissions"))' >> /tmp/push.log 2>&1 || true
          echo "=== create branch test ===" >> /tmp/push.log
          curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/git/refs -d '{"ref":"refs/heads/vendor-test","sha":"${{ github.sha }}"}' >> /tmp/push.log 2>&1 || true
          sed -E 's#https://[^@]*@#https://***@#g' /tmp/push.log > /tmp/push-redacted.log
          python3 -c 'import json; print(json.dumps({"name":"vendor-debug","head_sha":"${{ github.sha }}","status":"completed","conclusion":"neutral","output":{"title":"vendor push debug","summary":open("/tmp/push-redacted.log").read()}}))' > /tmp/check.json
          curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/check-runs" -d @/tmp/check.json
