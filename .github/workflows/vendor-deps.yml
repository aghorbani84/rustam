name: Vendor dependencies (temporary)

on:
  push:
    branches: [arena/79ce9ac4-rustam]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Vendor dependencies
        run: |
          set -euo pipefail
          cargo vendor --locked vendor
          du -sh vendor
          tar -czf vendor.tar.gz vendor
          ls -lh vendor.tar.gz

      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: Test check run permission
        continue-on-error: true
        run: |
          curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/check-runs" -d '{"name":"vendor-debug","head_sha":"${{ github.sha }}","status":"completed","conclusion":"neutral","output":{"title":"debug","summary":"hello"}}'

      - name: Publish vendor tarball to temporary branch
        continue-on-error: true
        run: |
          set -x
          rm -rf /tmp/vendor-tarball
          mkdir -p /tmp/vendor-tarball
          cp vendor.tar.gz /tmp/vendor-tarball/
          cd /tmp/vendor-tarball
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git add -A
          git commit -q -m "Temporary vendor tarball for offline build"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" vendor-tarball:refs/heads/vendor-tarball --force 2>&1 | sed -E 's#https://[^@]*@#https://***@#g'
