name: Vendor dependencies (temporary)

on:
  push:
    branches: [arena/79ce9ac4-rustam]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Vendor dependencies
        run: |
          set -euo pipefail
          cargo vendor --locked vendor
          du -sh vendor
          tar -czf vendor.tar.gz vendor
          ls -lh vendor.tar.gz

      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: Publish vendor snapshot to temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vendor-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          cp -a vendor .
          git add -A
          git commit -m "Temporary vendor snapshot for offline build"
          git push origin vendor-snapshot --force
