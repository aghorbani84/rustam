image: rust:latest

stages:
  - build
  - deploy

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/
    - target/

before_script:
  - rustup target add wasm32-unknown-unknown
  - cargo install dioxus-cli --locked

build:
  stage: build
  script:
    - dx build --release
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  only:
    - main
