[package]
name = "rustam"
version = "1.0.0"
edition = "2024"
authors = ["Abolfazl Ghorbani <abolfazlghorbani369@gmail.com>"]
description = "Modern Portfolio Website built with Rust and Dioxus"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/abolfazlghorbani369/rustam"
homepage = "https://abolfazlghorbani369.github.io/rustam/"
keywords = ["rust", "dioxus", "portfolio", "wasm", "webassembly"]
categories = ["web-programming"]

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "MediaQueryList",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlTextAreaElement",
    "HtmlAnchorElement",
    "Navigator",
    "Clipboard"
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid = { version = "1.0", features = ["v4", "js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
